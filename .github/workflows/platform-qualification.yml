name: Platform Qualification (hosted status)

# THIS REPOSITORY HOLDS NO REAL-HOST QUALIFICATION LANE, ON PURPOSE.
#
# The real qualification runs on the real soak host, and that host's runner is registered to the PRIVATE
# control repository `zhiheng-zhang-Mera/Boss-Qualification-Control` — never here. Two measured reasons, and
# one of them is why this file no longer has a `runs-on: [self-hosted, …]` job at all:
#
#   1. A self-hosted runner is registered for a whole repository, and no workflow-level guard can bind it to a
#      single workflow. This repository is PUBLIC, so attaching one would let workflow files proposed by
#      untrusted code name its labels. `gh api repos/…/Codex-Boss/actions/runners` returns 0, and that is the
#      fact the architecture rests on.
#   2. A dead lane is a trap: a job naming labels that nothing serves does not fail, it waits. The previous
#      revision kept such a job here after the runner moved, and a dispatch would have hung for a day.
#
# What remains is the honest hosted diagnostic: it runs what a clean hosted runner CAN run, and states plainly
# that it cannot qualify the real-host lifecycle evidence. The Phase 04 invariant (a discovered corpus over
# 1000 files) is not lowered, no filler corpus is created, and the gate is not skipped — a hosted runner
# simply has a handful of files, which is a topology fact rather than a regression.
#
# Real host qualification, the pinned candidate SHA, the runner security policy and the attestation metadata
# all live in the private control plane:
#     https://github.com/zhiheng-zhang-Mera/Boss-Qualification-Control
# The latest sealed production state is bound by the annotated tag
# `platform-foundation-production-v1.2` → 506e4a9631f0d3d411b77aa4a6e98ef665b0bfa0 (run 35422731193, 21/21).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-runner-status:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run install:electron

      - run: pnpm run build

      - run: node scripts/acceptance-evolution-bless.cjs --check

      - run: pnpm run architecture:snapshot

      - run: pnpm run state:migration-report

      - run: pnpm run capability:surface

      - name: Corpus provenance
        shell: powershell
        run: |
          node scripts/qualification-corpus-provenance.cjs | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: The Phase 04 gate, reported rather than hidden
        shell: powershell
        run: |
          $before = node scripts/qualification-corpus-provenance.cjs --digest
          node scripts/data-lifecycle-report.cjs
          $code = $LASTEXITCODE
          $after = node scripts/qualification-corpus-provenance.cjs --digest
          $lines = @(
            "",
            "## Hosted runner status",
            "",
            "| field | value |",
            "| --- | --- |",
            "| classification | **HOSTED_RUNNER_NOT_A_QUALIFICATION_HOST** |",
            "| phase 04 exit | $code |",
            "| corpus before | $before |",
            "| corpus after | $after |",
            "",
            "A GitHub-hosted runner has no accumulated host history, so the Phase 04 lifecycle gate cannot be",
            "satisfied here: its invariant is a corpus over 1000 files, and this runner has a handful. The",
            "threshold was NOT lowered, no filler corpus was created, and the gate was NOT skipped.",
            "",
            "Real host qualification is authoritative ONLY in the private control plane",
            "(zhiheng-zhang-Mera/Boss-Qualification-Control), where the real-soak self-hosted runner is",
            "registered and where the candidate public commit is checked out detached at an exact SHA. This",
            "repository holds no self-hosted runner at all, so nothing here can schedule one.",
            "",
            "The honest status of THIS runner is BLOCKED_BY_REAL_SOAK_EVIDENCE. This is topology, not regression."
          )
          $lines | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($code -eq 0) {
            Write-Host "::warning::the Phase 04 gate unexpectedly passed on a hosted runner; investigate rather than celebrate"
          }
          exit 0

      - name: State the architectural fact this workflow depends on
        shell: powershell
        run: |
          Write-Host "This repository must hold no self-hosted runner. Verify out of band:"
          Write-Host "  gh api repos/zhiheng-zhang-Mera/Codex-Boss/actions/runners      # expect total_count = 0"
          Write-Host "  gh api repos/zhiheng-zhang-Mera/Boss-Qualification-Control/actions/runners   # expect 1, boss-real-soak"
