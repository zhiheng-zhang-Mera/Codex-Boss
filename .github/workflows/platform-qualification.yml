name: Platform Qualification

# The frozen Phase 01-05 qualification gates, run where their evidence can honestly exist.
#
# WHY THIS IS NOT PART OF `Desktop CI`
#
# `Desktop CI` runs on a clean hosted Windows runner on every push, so it may only contain verification
# that a clean checkout can satisfy by itself: typecheck, secret scan, the architecture ratchet, the
# build, the default tier, the current-build tier and the slow tier. Three of the frozen gates cannot be
# satisfied that way, and that was measured rather than assumed — on run 35327676450 the Phase 04
# lifecycle gate found a 56-file corpus against its own >1000-file invariant (`artifacts/host-soak` alone
# holds ~65125 files on a host that has really been soaked), and the Phase 05 certificate read Phase
# 02/03/04 artifacts that no step had produced. Asking a push runner for accumulated history is not a
# strong gate, it is a red build that hides every other signal.
#
# So those gates keep every assertion, every threshold and every fail-closed path, and move here. Nothing
# in this workflow lowers a bar: the corpus invariant is untouched, no filler corpus is manufactured, no
# `process.env.CI` branch exists in any suite, no suite is skipped, and no generated artifact is committed
# to git. If the corpus cannot be produced honestly, this workflow is RED and says so in the job summary —
# a fake green would be worse than a blocked qualification.
#
# The prerequisite order below is the order the gates' own dependencies require, each artifact produced by
# its own official generator, so no suite ever reads a sibling test's side effect:
#
#   build
#     -> architecture:snapshot        (Phase 01 artifact; also required by the unit tier's own diagnostics)
#     -> state:migration-report       (Phase 02 artifact)
#     -> capability:surface           (Phase 03 artifact)
#     -> data:lifecycle-report        (Phase 04 artifact; needs an accumulated corpus)
#     -> platform:certificate         (Phase 05 certificate; consumes the four artifacts above)
#     -> verify:targeted              (runs the REAL full unit tier, then records the selector pairing)
#     -> test:platform-qualification  (the frozen gates themselves)
#
# Each arrow is a real dependency read out of the code, not a copy of a wish list: the certificate
# cross-checks the Phase 01-04 artifacts, the pairing generator executes the unit tier (which itself reads
# the Phase 01 snapshot), and the qualification gates read what the steps above produced.
#
# TRIGGERING. `workflow_dispatch` only, deliberately: this is the lane for release/promotion evidence and
# for an Owner-run qualification. It is not wired to push, and nothing in it may depend on a previous
# workflow run's state — a restored corpus would have to be restored explicitly, with provenance, and the
# provenance step below is what would record it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run install:electron

      # Every generator below loads the compiled platform out of dist-electron.
      - run: pnpm run build

      # The corpus provenance, recorded BEFORE anything depends on it, so a failure at the Phase 04 gate is
      # always accompanied by the numbers that explain it. Read-only: it reports, it does not gate.
      - name: Record the accumulated-corpus provenance
        if: always()
        run: |
          node scripts/qualification-corpus-provenance.cjs | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # Phase 01 -- architecture snapshot. Generated, never committed: `artifacts/` is gitignored.
      - run: pnpm run architecture:snapshot

      # Phase 02 -- state migration report.
      - run: pnpm run state:migration-report

      # Phase 03 -- permission surface report.
      - run: pnpm run capability:surface

      # Phase 04 -- data lifecycle report. This is the gate that needs a real accumulated corpus; on a
      # hosted runner with no soak history it FAILS its own invariant, loudly, and this workflow is red.
      - run: pnpm run data:lifecycle-report

      # Phase 05 gate 9 -- the platform certificate, generated by its own generator after the four phase
      # artifacts it cross-checks exist. The qualification tier below re-runs the generator in its test;
      # this step is what makes the artifact an explicit PREREQUISITE rather than a sibling's side effect.
      - run: pnpm run platform:certificate

      # Phase 05 gate 2 prerequisite -- a REAL full-suite run plus the selector pairing. It executes the
      # whole unit tier, which is also the full verification this chain is supposed to carry: a pairing
      # against a failing run proves nothing, and the generator refuses to write one.
      - run: pnpm run verify:targeted

      # The frozen qualification gates, with every prerequisite above already on disk.
      - run: pnpm run test:platform-qualification

      - name: Explain a blocked qualification
        if: failure()
        run: |
          $lines = @(
            "",
            "## Platform Qualification did not pass",
            "",
            "If the failure is the Phase 04 lifecycle gate reporting that the discovered corpus is too small,",
            "the honest status is **BLOCKED_BY_REAL_SOAK_EVIDENCE**, not a CI defect. That gate verifies the",
            "retention policy over a host corpus that only real, long-running activity produces; the corpus",
            "provenance recorded above is what this runner actually had.",
            "",
            "If the failure is anything else, it is a real defect in the frozen gates or in this chain, and it",
            "must be fixed rather than routed around."
          )
          $lines | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
