name: Desktop CI

# Logical jobs instead of one long staircase (convergence book, Phase O).
#
# The point is to know WHICH layer failed without reading a 200-line log, and to
# be able to re-run one layer by hand. Three of the four jobs are independent:
#
#   quality    typecheck + secret scan       (no build, no artifacts)
#   unit       build + the three test tiers  (needs quality)
#   package    portable build + smoke        (needs unit)
#   acceptance the whole attested chain      (needs unit)
#
# WHAT `GREEN` HERE MEANS, AND WHAT IT DOES NOT.
#
# This workflow runs on a clean hosted Windows runner on every push, so it may only contain verification
# a clean checkout can satisfy by itself. Green means: this commit typechecks, contains no tracked secret,
# keeps the architecture ratchet, builds, and passes the tiers whose declared prerequisites this runner can
# meet — the default tier (sources only), the current-build tier (`requires: ["build"]`) and the slow tier.
# It does NOT mean the platform's Phase 01-05 qualification gates were re-run, and it must not be read
# that way: those gates need generated phase artifacts, a real full-suite pairing record and a host corpus
# accumulated by real soak runs, none of which a fresh runner has.
#
# That is why three frozen gates are not in this file. `tests/acceptance/data-lifecycle-report.test.ts`,
# `tests/acceptance/platform-certificate.test.ts` and `tests/acceptance/targeted-vs-full.test.ts` are in
# the `test:platform-qualification` tier and run on the real soak host, by the qualification workflow in the
# separate PRIVATE control repository `Boss-Qualification-Control` (`workflow_dispatch`, main-only), which
# generates each declared prerequisite with its own official generator first. No workflow in this repository
# runs the tier: `.github/workflows/platform-qualification.yml` is a hosted DIAGNOSTIC lane that states
# `HOSTED_RUNNER_NOT_A_QUALIFICATION_HOST` instead of claiming a qualification. Nothing was skipped or
# weakened — measured on run
# 35327676450, the Phase 04 gate found a 56-file corpus here against its own >1000-file invariant, and the
# certificate read artifacts no step had produced. `tests/unit/test-layers.test.ts` enforces the boundary
# mechanically: no tier in this file may declare a qualification-only prerequisite, this file may not run a
# qualification producer, and no workflow in this repository may run the qualification tier. The graduation step
# `pnpm run acceptance:autonomous-evolution` DOES run here — see the note above it; a Root Trust change makes
# the committed epoch stale until `acceptance-evolution-bless.cjs --advance` runs in the same commit.
#
# Why the acceptance chain is ONE job rather than many: every step in it reads and
# writes `artifacts/acceptance/**` in the same working tree — the session fixes the
# commit, each gate writes a report, `acceptance:attest` binds that report to the
# session, and `acceptance:prestart` reads the sixteen attested reports. Splitting
# those across runners would make the attestation chain depend on artifact plumbing
# rather than on the evidence itself. `needs:` keeps the layers ordered, and the
# failure isolation the book asks for comes from the three independent jobs.
#
# Every job re-checks out and re-installs: a job is a fresh runner, and pretending
# otherwise is how a "split" CI quietly stops testing what it claims to.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # The cheapest, most common failure layer: a type error or a tracked secret is
    # reported here in about a minute, without waiting for the build.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run security:scan
      # Platform foundation Phase 01: the architecture ratchets. This is the
      # `quality` layer rather than the `unit` layer on purpose — it needs no build
      # and no Electron, and a dependency cycle or a duplicate durable-state owner is
      # exactly the kind of failure that should be reported in the first minute rather
      # than after a 20-minute suite. It is a separate step from the unit tests so the
      # failing boundary is named in the CI UI without reading a log.
      - run: pnpm run architecture:ratchet
      # Platform foundation Phase 02: the runtime must actually provide the SQLite
      # features the state core depends on. The probe MEASURES them (WAL, savepoints,
      # user_version, durability across reopen, a loud refusal on a corrupt file) and
      # exits non-zero if any is missing, so a runtime change cannot silently remove the
      # substrate the durable state core is built on.
      - run: pnpm run state:probe

  unit:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run install:electron
      # The build must precede the test run. Several acceptance harnesses
      # (scripts/r901-soak.cjs, scripts/closure-soak-2h.cjs, the acceptance-*.cjs
      # family, scripts/benchmark.cjs) `require` the compiled modules under
      # dist-electron at load time, and dist-electron is a gitignored build
      # output. tests/unit/closure-terminal-logic.test.ts spawns those harnesses,
      # so with the old order (test before build) the harness died with
      # "Cannot find module '../dist-electron/...'" and exited 1 instead of its
      # documented exit code, failing two tests on every run.
      - run: pnpm run build
      # The Phase 01 architecture snapshot, which the default tier READS.
      #
      # `tests/acceptance/platform-architecture-diagnostics.test.ts` requires the artifact at
      # `artifacts/platform-foundation/phase-01/architecture-snapshot.json`: one case asserts it exists and
      # holds the expected counts, and a second regenerates it and requires the result to match apart from
      # its own `generatedAt` stamp. `artifacts/` is gitignored (0 tracked files), so on a clean checkout the
      # file is absent and the suite failed on every run with "the phase artifact is missing" — the tier did
      # NOT in fact need only the sources, which is what the note below used to claim.
      #
      # Generating it first is the fix, and it is honest: the file is derived from the sources by this
      # repository's own script (no network; the only non-source field is `generatedAt`, which the comparison
      # above ignores). It costs well under a second.
      #
      # It is NOT needed by `architecture:ratchet` in the job above: the ratchet reads the committed
      # `config/architecture-baseline.json`, and the snapshot path appears in that script only as a write
      # target.
      - run: pnpm run architecture:snapshot
      # The default tier: fast, deterministic, and — with the snapshot step above — needs nothing on a clean
      # checkout that the workflow does not produce. See vitest.tiers.mjs.
      - run: pnpm test
      # The build-dependent tier: the suites that read the real dist/ + dist-electron/
      # output. They must follow the build, which is the ordering this job has always
      # had; moving them into their own declared step is what lets `pnpm test` stop
      # depending on a build without making these suites skip when one is missing.
      - run: pnpm run test:postbuild
      # The slow tier: suites that compile and execute real projects in a fixture.
      # They run one file at a time with a timeout justified by what they do, so a
      # green commit cannot be turned red by parallel load. See
      # vitest.slow.config.mjs.
      - run: pnpm run test:slow

  acceptance:
    # The authoritative chain. Each `acceptance:attest` binds one gate's report to
    # the session and the commit, and `acceptance:prestart` refuses to certify
    # anything it cannot re-derive from those reports.
    needs: unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run install:electron
      - run: pnpm run build
      # checkpoint-2 §5.2/§5.3/§10.1: the authoritative Prestart run starts here. It
      # fixes the exact commit, refuses a dirty working tree in certification mode and
      # archives the previous run's transient evidence, so no stale report can join
      # this certification.
      - run: pnpm run acceptance:session:start -- --certify --clean
      # checkpoint-1 §4.1/§4.2: the WorkBook production acceptance is its own
      # gate — it re-runs the WB-01..WB-10 suite AND verifies the machine
      # readable report it produced, so a scenario that silently degrades to
      # NOT_RUN cannot pass as green.
      - run: pnpm run acceptance:workbook
      # checkpoint-2 §5.5/§10.3: every gate's report is strictly validated and bound
      # to its SHA-256, this session and this commit. A failed attestation fails CI
      # immediately, before Graduation is even reachable.
      - run: pnpm run acceptance:attest -- acceptance-workbook
      # checkpoint-1 §5: the Knowledge Foundation gate. It drives two real
      # WorkBook dispatches in one project and proves the second task reuses the
      # first task's architecture/test/UI/constraint/decision knowledge with the
      # project directory deleted, i.e. with no rescan possible.
      - run: pnpm run acceptance:knowledge
      - run: pnpm run acceptance:attest -- acceptance-knowledge
      # checkpoint-1 §6/§9: the architecture and UI surface discovery gate. It
      # builds the Repository World Model for this very repository (layout,
      # package managers, CI, languages, entry points, dependency graph, impact
      # analysis, capability verdicts) and the UI surface registry with
      # evidence-backed bindings.
      - run: pnpm run acceptance:architecture
      - run: pnpm run acceptance:attest -- acceptance-architecture
      # checkpoint-1 §25: the theme engine gate (TH-01..TH-15). TH-04/05/06 —
      # prompt-driven generation and the preview sandbox — are explicit NOT_RUN
      # until CP5; every other item must pass.
      - run: pnpm run acceptance:theme
      - run: pnpm run acceptance:attest -- acceptance-theme
      # checkpoint-1 §28: the requirements graph gate. It compiles the graph
      # inside the real WorkBook dispatch (types, explained dependency edges,
      # quarantined conflicting requirements) and checks the §28.4 acceptance
      # binding, including the fail-closed rule that a claim is not evidence.
      - run: pnpm run acceptance:requirements
      - run: pnpm run acceptance:attest -- acceptance-requirements
      # checkpoint-1 §29: the execution planner gate. The DAG is built inside the
      # real dispatch and every node must carry objective/requirements/inputs/
      # scope/allowed files/outputs/verification/dependencies/rollback, with
      # concurrency derived from the host's observed resources.
      - run: pnpm run acceptance:plan
      - run: pnpm run acceptance:attest -- acceptance-plan
      # checkpoint-1 §30/§31: the verification engine gate (V-01..V-10). It drives
      # the real host engine against a real git fixture — scope-bounded atomic
      # change units, §30.2 git/hash/existence verification of a worker's claim,
      # the §31.1 ladder with real tsc and real node --test, and the durable §31.3
      # Evidence Ledger.
      - run: pnpm run acceptance:verify
      - run: pnpm run acceptance:attest -- acceptance-verify
      # checkpoint-1 §30/§32: the implementation loop + multi-layer review gate
      # (C-01..C-11). It drives the real loop — bounded worker, host verification,
      # §32 review over real artifacts (secret scan, ledger, generated-file
      # classification), HIGH/MEDIUM back to repair — and refuses COMPLETED unless
      # every required review dimension was actually reviewed.
      - run: pnpm run acceptance:review
      - run: pnpm run acceptance:attest -- acceptance-review
      # checkpoint-1 §33: the self-healing gate (RC-01..RC-10). Failures the host
      # really produced (a tsc diagnostic, a missing module, a failing node --test,
      # the §7.3 mutation refusal, a theme validation report) are classified, the
      # recovery order is walked with budgets, and every HNS fallback must leave a
      # durable CapabilityGap.
      - run: pnpm run acceptance:self-healing
      - run: pnpm run acceptance:attest -- acceptance-self-healing
      # checkpoint-1 §34: the capability-gap gate (CG-01..CG-10). A real §33.3
      # backlog is aggregated by capability, the improvement chain is walked with
      # real machinery (the §30 loop, a real regression climb, the §5.3 gate, a
      # real probe), and a gap closes only when the probe moved.
      - run: pnpm run acceptance:capability-gap
      - run: pnpm run acceptance:attest -- acceptance-capability-gap
      # checkpoint-1 §35/§36: the candidate + Guardian gate (GD-01..GD-10). The
      # §35 lifecycle is walked (RUNNING → … → CANDIDATE → ACCEPTED, and a jump is
      # refused), then the §36 checklist decides release over real artifacts: the
      # §31.3 ledger, the §32 coverage, the real secret scanner, git's deletions,
      # the contract's overrides and real theme packages.
      - run: pnpm run acceptance:candidate
      - run: pnpm run acceptance:attest -- acceptance-candidate
      # checkpoint-1 §37/§38: the version-impact + Git-checkpoint gate (VC-01..VC-08).
      # The host decides NONE/PATCH/MINOR/MAJOR from real source inspection, refuses
      # a worker's conflicting claim, records a real checkpoint (HEAD/branch/diff/
      # task/candidate/evidence), refuses a remote write without one, and rolls back
      # for real — with the Owner's approval required before discarding commits.
      - run: pnpm run acceptance:version-checkpoint
      - run: pnpm run acceptance:attest -- acceptance-version-checkpoint
      # checkpoint-1 §39/§40: the publishing gate (PB-01..PB-10). The branch policy,
      # the commit trailers and the PR sections are enforced, and the release is
      # exercised for real: a real bare remote receives the pushed branch, and the
      # real GitHubGateway (with a recording transport and a locally generated App
      # key) shows the exact REST calls — no network, no stored credential.
      - run: pnpm run acceptance:publish
      - run: pnpm run acceptance:attest -- acceptance-publish
      # checkpoint-1 §41: the CI repair-loop gate (CR-01..CR-08). A real failing
      # tsc/node --test log is parsed, classified in §33's vocabulary, repaired
      # through the §30 loop, verified locally, pushed with the §39/§40 runner and
      # re-read — bounded, never claiming PASS without a green CI read.
      - run: pnpm run acceptance:ci-repair
      - run: pnpm run acceptance:attest -- acceptance-ci-repair
      # checkpoint-1 §42–§45 + §51/§52: the final-acceptance gate (FS-01..FS-08).
      # The §42 checklist is evaluated over the artifacts the earlier checkpoints
      # wrote, a missing artifact is NOT_VERIFIED (never a pass), §44/§45 decide what
      # may block, and the §51/§52 catalogues point at gates that really run.
      - run: pnpm run acceptance:final
      - run: pnpm run acceptance:attest -- acceptance-final
      # checkpoint-1 §53: the soak gate (SK-01..SK-06). Rounds really clone from a
      # bare remote, bootstrap, change, roll back, name a policy branch, read their
      # own ledger and complete; the six §53 metrics are absolutes, a repeated
      # identical failure stops the soak, and §51's eighteen scenarios are ordered.
      - run: pnpm run acceptance:soak
      - run: pnpm run acceptance:attest -- acceptance-soak
      - run: pnpm run acceptance:github-machine
      - run: pnpm run benchmark
      # Overcomplete §17.4 Tier 2: controlled Electron restart smoke — the app
      # is killed mid-task and must resume without duplicating side effects.
      - run: node scripts/acceptance-restart.cjs
      # checkpoint-1 §4.3: the desktop WorkBook black box. A real Electron
      # instance is driven over CDP through the real renderer (Work mode →
      # workspace → dropped WorkBook → submit) and the durable main-process
      # state is verified afterwards, so UI → IPC → main → WorkBook production
      # path is exercised in CI, not only by direct function calls.
      - run: pnpm run acceptance:desktop-workbook
      # checkpoint-2 §6.3: the real application must satisfy its complete versioned
      # claim contract — exactly 89 stable claim ids, every one PASS. A 1/89 or 88/89
      # report (or one modified after attestation) fails here.
      - run: pnpm run acceptance:attest -- acceptance-desktop-workbook
      # checkpoint-1 §57/§58 + checkpoint-2 §8: the trusted root audit. It reads the
      # session, the sixteen attested gate reports, the desktop black box under its
      # contract and the Owner intervention ledger, derives the thirteen capabilities
      # from trusted evidence only and seals the decision with a root hash.
      - run: pnpm run acceptance:bootstrap-completion
      # checkpoint-2 §5.6/§6.5/§7.6/§8.7/§9: the suites that harden the trust boundary
      # itself. They are re-run here, after the session started, so their evidence is
      # attested against this run rather than against the `pnpm test` phase.
      - run: pnpm run acceptance:evidence-integrity
      - run: pnpm run acceptance:attest -- acceptance-evidence-integrity
      - run: pnpm run acceptance:desktop-contract
      - run: pnpm run acceptance:attest -- acceptance-desktop-contract
      - run: pnpm run acceptance:owner-ledger
      - run: pnpm run acceptance:attest -- acceptance-owner-ledger
      - run: pnpm run acceptance:root-hardening
      - run: pnpm run acceptance:attest -- acceptance-root-hardening
      - run: pnpm run acceptance:adversarial
      - run: pnpm run acceptance:attest -- acceptance-adversarial
      # checkpoint-2 §10.4/§12: the single authoritative graduation command. It prints
      # PRESTART_CERTIFIED / BOOTSTRAP_COMPLETE only if every condition of §12 holds,
      # and writes artifacts/acceptance/prestart-attestation.json (+ .md).
      - run: pnpm run acceptance:prestart
      # Update-Plan/self-evlo.md Phase A–E (Post-Prestart trust hardening): the
      # identity/build/dependency/contract/test binding, the Root Trust Surface and
      # trust epoch boundary, the independent certificate verifier, and the expanded
      # adversarial/fuzz/metamorphic batteries. Each is attested like every other
      # gate, so the evolution certificate cannot inherit a claim it did not verify.
      - run: pnpm run acceptance:evolution-identity
      - run: pnpm run acceptance:attest -- acceptance-evolution-identity
      - run: pnpm run acceptance:evolution-trust
      - run: pnpm run acceptance:attest -- acceptance-evolution-trust
      - run: pnpm run acceptance:evolution-independent
      - run: pnpm run acceptance:attest -- acceptance-evolution-independent
      - run: pnpm run acceptance:evolution-adversarial
      - run: pnpm run acceptance:attest -- acceptance-evolution-adversarial
      # Phase F (§72–§75, §94/§95): the real trial battery — 20 seeded evolution
      # rounds in this checkout (change → verify → evidence → rollback), plus budget,
      # scope, containment, mid-round process kill, negative and self-corruption
      # cases. It refuses to run on a dirty tree.
      - run: pnpm run acceptance:evolution-battery -- --rounds 20
      - run: pnpm run acceptance:attest -- acceptance-evolution-trial
      # §18/§19: an independent verifier re-derives the Prestart certificate without
      # importing the trust modules, and the graduation command requires validator A
      # AND validator B to agree before it prints AUTONOMOUS_EVOLUTION_CERTIFIED.
      - run: pnpm run verify:certificate
      # §18/§19: the graduation gate. Validators A and B must agree before it prints
      # AUTONOMOUS_EVOLUTION_CERTIFIED.
      #
      # It ends in `judgeSelfCertification`, whose binding condition here is the TRUST EPOCH ANCHOR: this
      # file is Root Trust Surface (`PLAN_SECTION_3_ROOT_TRUST_PATHS` names `.github/workflows/ci.yml` and
      # `tests/acceptance/**`), so a change to it moves the surface aggregate and requires
      # `node scripts/acceptance-evolution-bless.cjs --advance` in the SAME commit — the cadence epochs 11
      # and 13 followed. CI is then the run that certifies the new epoch.
      #
      # A previous revision of this file moved this step out of CI, reasoning from
      # `judgeSelfCertification` alone that a commit touching the surface can NEVER pass. That was wrong
      # about the CALLER: the acceptance gate compares the surface with ITSELF
      # (`assessRootTrustChange({ baseline: entries, candidate: entries })`), so `rootTrustTouched` is false
      # there and the epoch anchor is the whole condition. Measured on run 35334147247, the refusal was
      # `trust epoch 20 REFUSED` (`epoch 20 certifies 35448480... but the surface is 1ebe2141...`) +
      # `SELF_CERTIFICATION_FORBIDDEN:TRUST_EPOCH_MIGRATION` — an unanchored epoch, which one authorised
      # migration fixes and which routing the step away would only have hidden. It is back in the chain, and
      # `tests/unit/test-layers.test.ts` pins both the refusal invariant and the anchor.
      - run: pnpm run acceptance:autonomous-evolution
      # checkpoint-2 §2.8/§11: the authority is the attestation plus this CI run, so
      # the whole evidence set is published with the run (even when it failed).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prestart-attestation
          path: |
            artifacts/acceptance/prestart-attestation.json
            artifacts/acceptance/prestart-attestation.md
            artifacts/acceptance/autonomous-evolution-attestation.json
            artifacts/acceptance/autonomous-evolution-attestation.md
            artifacts/acceptance/bootstrap-completion.json
            artifacts/acceptance/session.json
            artifacts/acceptance/owner-interventions.json
            artifacts/acceptance/evolution-*.json
            artifacts/acceptance/attestations/
          if-no-files-found: warn

  package:
    # Independent of the acceptance chain: nothing in it reads the packaged output
    # (`smoke-portable.ps1` reads `artifacts/latest-package.json`, which this job
    # writes itself), and no gate reads the portable package.
    needs: unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run install:electron
      - run: pnpm run build
      - run: pnpm run package:portable
      - run: powershell -NoProfile -File scripts/smoke-portable.ps1
