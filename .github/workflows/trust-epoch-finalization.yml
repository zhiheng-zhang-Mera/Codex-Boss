name: Trust Epoch Finalization

# STAGE B of a trust migration: the EXTERNAL OWNER AUTHORIZATION, and the only place a trust epoch is
# advanced.
#
# WHY THIS IS A SEPARATE, PROTECTED WORKFLOW
#
# `scripts/acceptance-evolution-bless.cjs --advance` used to be a manual command with no machine gate: any
# shell on the host could run it, and the epoch was committed together with the change it anchors. That is
# DOCUMENTATION_ONLY enforcement — the record could be written by whoever was editing the tree. This
# workflow is the machine form of "AUTHORITY IS EXTERNAL":
#
#   - `workflow_dispatch` only. No push, no pull_request, no schedule, so no pull request or fork can reach
#     it and no autonomous actor can trigger it by landing code.
#   - `refs/heads/main` only, asserted in the job (not merely implied), failing closed with
#     `TRUST_EPOCH_FINALIZATION_REQUIRES_MAIN`.
#   - the job targets the `boss-root-trust-owner` ENVIRONMENT, whose required reviewer is the Root Owner and
#     whose `can_admins_bypass` is FALSE. GitHub holds the job before it starts until that user approves it.
#     Boss's autonomous credential cannot approve an environment deployment; a credential that cannot
#     approve cannot finalize.
#   - the reason for the migration is a required dispatch input and is recorded in the proposal, the commit
#     message and the uploaded evidence.
#   - the only write is `trust-policy/trust-epoch.json`, produced by the blessing step from the measured
#     live surface. The step is followed by `--check`, so a migration that did not anchor the surface cannot
#     be reported as one that did.
#
# WHAT IT DELIBERATELY DOES NOT DO
#
# It does not push the epoch to `main` with a stored owner credential. It creates the epoch commit on a branch and
# hands the pull request off to the repository's machine identity, so the final act is the Owner's merge under the
# repository ruleset (`require_code_owner_review`, with the Owner as the only always-bypass actor). A workflow that
# held a bypass PAT would be a second Owner credential in a runner, which Phase A4/A6 forbid.
#
# THE TRANSPORT BOUNDARY, AND WHY IT MOVED (Mission-4D hardening)
#
# This workflow used to end with `gh pr create`. Repository policy does not permit the Actions `GITHUB_TOKEN` to
# create pull requests, so that step failed -- and it failed identically for two consecutive epochs:
#
#     epoch 26:  ceremony PASS, --advance PASS, --check PASS, branch pushed PASS, gh pr create FAIL
#     epoch 27:  ceremony PASS, --advance PASS, --check PASS, branch pushed PASS, gh pr create FAIL
#
# The epoch was correctly produced and anchored both times, and the workflow was reported FAILED both times. The
# defect is semantic before it is operational: the terminal state described the workflow's TRANSPORT rather than its
# CEREMONY, so a reader could not tell "the epoch is wrong" from "the epoch is right and nobody was told".
#
# The corrected shape:
#
#     produce + verify (--check) + push + hand off   ->  SUCCESS  (EPOCH_BRANCH_READY)
#     nothing to migrate                             ->  SUCCESS  (NO_MIGRATION, nothing written)
#     branch already exactly right                   ->  SUCCESS  (EPOCH_BRANCH_ALREADY_READY, no re-advance)
#     branch exists and disagrees                    ->  FAILURE  (EPOCH_BRANCH_CONFLICT, fail closed)
#
# AUTHORITY IS REDUCED, NOT MOVED. `pull-requests: write` is gone because the permission existed only to fail; no
# Owner credential, App private key or broader scope replaces it. PR transport belongs to the Codex-Boss App
# machine identity (`createGitHubMachineRuntime` -> `GitHubGateway.createPullRequest`), which consumes the
# machine-readable handoff this workflow writes. `contents: write` stays: the workflow must still commit and push
# the epoch branch, and that is the whole of what it may do.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this trust epoch migration is authorised (recorded in the proposal, the commit and the evidence)."
        required: true
        type: string
      risk:
        description: "Known risk of this migration (recorded verbatim)."
        required: true
        type: string
      rollback:
        description: "Rollback path if the migration is wrong (recorded verbatim)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  finalize:
    # The external Owner gate. A job that targets an environment with required reviewers does not start
    # until the named reviewer approves the deployment.
    environment: boss-root-trust-owner
    runs-on: windows-latest
    steps:
      - name: Refuse anything that is not main
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            Write-Error "TRUST_EPOCH_FINALIZATION_REQUIRES_MAIN: this workflow may only run on refs/heads/main, got ${{ github.ref }}"
            exit 1
          }
          Write-Host "ref is refs/heads/main"

      # THE DISPATCH SHA, NOT FLOATING `main`. (Workbook section 9 B1.)
      #
      # `ref: main` made this workflow a TOCTOU hole. A `workflow_dispatch` run whose job targets an environment
      # with required reviewers does not start until the named reviewer approves it, and between the dispatch and
      # that approval `main` can move. With `ref: main` the approved run would measure and anchor whatever `main`
      # had become, while the run reports `head_sha` of the commit it was dispatched on -- so the run's reported
      # subject and the tree it actually measured could differ, and the epoch record (whose subject is "the surface
      # at this commit") would certify a tree no one dispatched or approved.
      #
      # `ref: ${{ github.sha }}` binds the checkout to the commit the dispatch named. That is the whole repair:
      # after it, approving a waiting run can only ever finalize the commit the run was opened for.
      #
      # `fetch-depth: 0` is kept: the advance reads history, and the assertion step below uses `git rev-parse HEAD`.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The provenance assertion, in the JOB rather than in a comment. `ref:` above is the mechanism; this step is
      # the proof that the mechanism is in force on THIS run, and it fails closed and by name.
      #
      # It is deliberately the first thing after the checkout: every later step's meaning depends on the tree being
      # the dispatched one, so a run that cannot establish that must not reach the measure/advance/verify sequence at
      # all. The failure code is its own (`TRUST_EPOCH_FINALIZATION_SHA_MISMATCH`), so a reader can tell "the
      # checkout was bound but the runner disagreed" from the ordinary "this is not main" refusal above.
      #
      # Both SHAs are published to `$GITHUB_ENV` so the handoff step can state them in the artifact as well as in
      # the log: a mechanism that only appears in a log line is not evidence a reader of the artifact can check.
      - name: Assert the checked-out commit IS the dispatch SHA (fail closed)
        shell: pwsh
        run: |
          $dispatchSha = "${{ github.sha }}"
          $checkedOut = (git rev-parse HEAD).Trim()
          Write-Host "dispatch_sha=$dispatchSha"
          Write-Host "checked_out_sha=$checkedOut"
          if ($checkedOut -ne $dispatchSha) {
            Write-Error "TRUST_EPOCH_FINALIZATION_SHA_MISMATCH: the run was dispatched on $dispatchSha but the checked-out tree is $checkedOut. A waiting run approved after main moved would otherwise anchor a surface it was never dispatched or approved for."
            exit 1
          }
          "DISPATCH_SHA=$dispatchSha`nCHECKED_OUT_SHA=$checkedOut" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TRUST_EPOCH_FINALIZATION_SHA_BOUND=$checkedOut"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run install:electron

      - run: pnpm run build

      # STAGE A runs first and is the same script any autonomous actor may run: it measures and proposes,
      # and it never writes the epoch.
      - name: Stage A — the autonomous proposal
        shell: pwsh
        run: |
          node scripts/trust-migration-proposal.cjs --out artifacts/platform-foundation/trust/trust-migration-proposal.json --reason "${{ inputs.reason }}" --risk "${{ inputs.risk }}" --rollback "${{ inputs.rollback }}"
          $proposal = Get-Content artifacts/platform-foundation/trust/trust-migration-proposal.json -Raw | ConvertFrom-Json
          "NEEDS_MIGRATION=$($proposal.needsMigration.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CURRENT_EPOCH=$($proposal.currentEpoch.trust_epoch)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CANDIDATE_EPOCH=$($proposal.candidateEpoch.trust_epoch)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BASE_SHA=$($proposal.repository.commit)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROPOSED_SURFACE=$($proposal.candidateEpoch.root_surface_hash)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROPOSED_PARENT=$($proposal.candidateEpoch.parent_epoch_hash)" | Out-File -FilePath $env:GITHUB_ENV -Append
          # THE RECORD THIS RUN PROPOSES, as a plain record-shaped object.
          #
          # The idempotency check downstream compares what this run WOULD produce against what the branch
          # already carries. Comparing against the COMMITTED tree instead would always disagree -- the
          # committed epoch is by definition the stale one, which is exactly why a migration was needed at
          # all -- so a matching branch would be misreported as a conflict and a rerun would fail instead of
          # succeeding idempotently.
          #
          # The epoch hash is the one field the proposal cannot know: the advance computes it. It is filled in
          # after the advance when one happened, and for an already-ready branch the FETCHED record supplies
          # it, because a matching branch means the two hashes are equal by definition.
          if ($proposal.needsMigration) {
            $expected = [ordered]@{
              trust_epoch           = $proposal.candidateEpoch.trust_epoch
              root_contract_version = $proposal.candidateEpoch.root_contract_version
              root_surface_hash     = $proposal.candidateEpoch.root_surface_hash
              parent_epoch_hash     = $proposal.candidateEpoch.parent_epoch_hash
              epoch_hash            = $null
            }
            [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/expected-epoch.json", ($expected | ConvertTo-Json), (New-Object System.Text.UTF8Encoding($false)))
          }

      # IDEMPOTENCY, BEFORE ANY WRITE.
      #
      # A rerun must not advance an epoch twice. The rule is decided by a pure module so it can be tested
      # exhaustively, and this step refuses to move if the branch already carries a DIFFERENT record:
      #
      #   branch absent                      -> continue, produce it
      #   branch present, same epoch record  -> EPOCH_BRANCH_ALREADY_READY, reuse it, do NOT advance
      #   branch present, different record   -> EPOCH_BRANCH_CONFLICT, fail closed
      #
      # Overwriting or force-pushing an Owner-authorised epoch branch would destroy the record of a ceremony that
      # already happened, so the conflict path is a refusal and not a repair.
      - name: Stage B — check the epoch branch for an existing, already-finalized epoch
        if: env.NEEDS_MIGRATION == 'true'
        shell: pwsh
        run: |
          $branch = "trust-epoch/boss-root-trust-$env:CANDIDATE_EPOCH"
          "EPOCH_BRANCH=$branch" | Out-File -FilePath $env:GITHUB_ENV -Append
          $existing = git ls-remote --heads origin $branch
          if ([string]::IsNullOrWhiteSpace($existing)) {
            "BRANCH_EXISTS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "epoch branch $branch does not exist yet"
            exit 0
          }
          "BRANCH_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "epoch branch $branch already exists; reading the record it carries"
          git fetch --depth 1 origin $branch
          $existingJson = git show FETCH_HEAD:trust-policy/trust-epoch.json
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/existing-epoch.json", $existingJson, (New-Object System.Text.UTF8Encoding($false)))
          # The record on the branch IS what this run would produce -- that is precisely what "already ready"
          # means, and it is why no re-advance happens. Seeding the expected record from it is therefore honest,
          # not circular: it lets the comparison below decide whether the branch MATCHES this run's proposal,
          # which is exactly the case where the two epoch hashes are equal by definition. Leaving the expected
          # hash null here would make a matching branch compare unequal to itself and be reported as a conflict,
          # inverting the idempotency rule into a permanent failure.
          $expectedPath = "$env:RUNNER_TEMP/expected-epoch.json"
          if (Test-Path $expectedPath) {
            $expected = Get-Content $expectedPath -Raw | ConvertFrom-Json
            $existingRecord = $existingJson | ConvertFrom-Json
            $expected.epoch_hash = $existingRecord.epoch_hash
            [System.IO.File]::WriteAllText($expectedPath, ($expected | ConvertTo-Json), (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "comparing the proposal against the record on $branch (epoch_hash $($existingRecord.epoch_hash))"
          }

      # STAGE B. Only reached when the committed epoch genuinely does not anchor the live surface, which the
      # proposal measured rather than assumed -- and only when the branch does not already carry the record.
      - name: Stage B — advance the epoch (Owner-authorised)
        if: env.NEEDS_MIGRATION == 'true' && env.BRANCH_EXISTS != 'true'
        shell: pwsh
        run: |
          node scripts/acceptance-evolution-bless.cjs --advance
          node scripts/acceptance-evolution-bless.cjs --check
          $diff = git status --porcelain
          Write-Host "working tree after advance:`n$diff"
          if (-not ($diff -match "trust-policy/trust-epoch.json")) {
            Write-Error "TRUST_EPOCH_FINALIZATION_NO_CHANGE: --advance did not produce an epoch change, so there is nothing to authorise"
            exit 1
          }
          # Fill the proposed record's epoch hash from the record the advance just wrote, so a later rerun has a
          # complete expected record to compare against.
          $produced = Get-Content trust-policy/trust-epoch.json -Raw | ConvertFrom-Json
          $expectedPath = "$env:RUNNER_TEMP/expected-epoch.json"
          if (Test-Path $expectedPath) {
            $expected = Get-Content $expectedPath -Raw | ConvertFrom-Json
            $expected.epoch_hash = $produced.epoch_hash
            [System.IO.File]::WriteAllText($expectedPath, ($expected | ConvertTo-Json), (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "proposed epoch hash $($produced.epoch_hash)"
          }

      - name: Stage B — the migration must have been needed
        if: env.NEEDS_MIGRATION != 'true'
        shell: pwsh
        run: |
          Write-Host "The committed epoch already anchors the live Root Trust Surface; nothing to finalize."
          Write-Host "No epoch was advanced and no commit was created. This is a successful no-op."
          # Name the terminal state, or the workflow would end with no FINALIZATION_RESULT on its own correct
          # no-op path and a reader could not tell "already anchored" from "fell through doing nothing".
          "FINALIZATION_RESULT=NO_MIGRATION" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage B — commit the epoch on an Owner-reviewed branch
        if: env.NEEDS_MIGRATION == 'true' && env.BRANCH_EXISTS != 'true'
        shell: pwsh
        run: |
          $branch = $env:EPOCH_BRANCH
          git config user.name "Codex-Boss Trust Epoch Finalization"
          git config user.email "trust-epoch@users.noreply.github.com"
          git checkout -b $branch
          # ONLY the epoch record is staged. `artifacts/**` is gitignored, so adding the proposal path here both
          # refuses the pathspec and makes the step's success depend on the shell's native-command error
          # preference -- a governance step whose outcome turns on a shell setting. The proposal survives as a
          # workflow artifact upload, which is what the evidence step below is for.
          git add trust-policy/trust-epoch.json
          $message = @"
          chore(trust): finalize epoch $env:CANDIDATE_EPOCH under Owner authorisation

          Authorised through the boss-root-trust-owner protected environment (run ${{ github.run_id }}).

          reason: ${{ inputs.reason }}
          risk: ${{ inputs.risk }}
          rollback: ${{ inputs.rollback }}
          "@
          $message | Out-File -FilePath commit-message.txt -Encoding utf8
          git commit -F commit-message.txt
          git push --set-upstream origin $branch
          $sha = git rev-parse HEAD
          "EPOCH_COMMIT=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "pushed $branch at $sha"

      # THE TERMINAL DECISION, AND THE HANDOFF.
      #
      # This replaces the PR-creation step. It decides the terminal state from facts already measured (needs
      # migration, branch existence, the expected record vs the one on the branch), exits 0 on every SUCCESS state
      # and non-zero only on a genuine refusal, and writes the machine-readable handoff the App identity consumes.
      #
      # It does NOT create a pull request, and it holds no credential with which it could.
      - name: Stage B — decide the terminal state and write the PR handoff
        if: env.NEEDS_MIGRATION == 'true'
        shell: pwsh
        run: |
          # What THIS RUN WOULD PRODUCE -- always the record Stage A wrote from the proposal, never the
          # committed tree: the committed epoch is the stale one by definition, so comparing against it would
          # report a matching already-ready branch as a conflict.
          $expectedPath = "$env:RUNNER_TEMP/expected-epoch.json"
          if (-not (Test-Path $expectedPath)) { Write-Error "TRUST_EPOCH_FINALIZATION_NO_EXPECTED: the proposed record was not written by Stage A"; exit 1 }
          # What THE BRANCH ALREADY CARRIES, when it exists.
          $existingPath = "$env:RUNNER_TEMP/existing-epoch.json"
          $existingArg = if (Test-Path $existingPath) { $existingPath } else { "" }
          # The epoch branch's own commit, read from the branch when this run did not produce one. Without it
          # the already-ready path would hand off a request naming no commit, and the App could not open a PR
          # against it.
          $epochCommit = if ($env:EPOCH_COMMIT) { $env:EPOCH_COMMIT }
                         elseif (Test-Path $existingPath) { (git rev-parse FETCH_HEAD) }
                         else { "" }
          $epochHash = if (Test-Path $existingPath) { (Get-Content $existingPath -Raw | ConvertFrom-Json).epoch_hash } else { $null }
          # Section 9 B1: the checkout binding, restated in the artifact. These are the two facts the assertion step
          # above proved equal before any measurement happened; refusing to state them here would leave the artifact
          # silent about the very property this repair added.
          #
          # The environment values come from the assertion step's own two lines of `$GITHUB_ENV`. They are read as
          # separate variables and each is checked: a single joined read would bind the whole multi-line block to the
          # first name and hand the handoff a string that is not a commit -- which the artifact's own validator would
          # then have to refuse, turning a transport mistake into a governance refusal.
          $dispatchSha = $env:DISPATCH_SHA
          $checkedOutSha = $env:CHECKED_OUT_SHA
          if (-not $dispatchSha -or -not $checkedOutSha) {
            Write-Error "TRUST_EPOCH_FINALIZATION_NO_PROVENANCE: the assertion step did not publish DISPATCH_SHA/CHECKED_OUT_SHA, so the handoff cannot state the checkout binding"
            exit 1
          }
          $handoffDir = "artifacts/platform-foundation/trust"
          New-Item -ItemType Directory -Force -Path $handoffDir | Out-Null
          $handoffPath = "$handoffDir/epoch-pr-handoff.json"
          node scripts/trust-epoch-finalize-handoff.cjs `
            --repository "${{ github.repository }}" `
            --run-id "${{ github.run_id }}" `
            --base-branch main `
            --base-sha "$env:BASE_SHA" `
            --candidate-epoch "$env:CANDIDATE_EPOCH" `
            --branch "$env:EPOCH_BRANCH" `
            --root-surface-hash "$env:PROPOSED_SURFACE" `
            --expected-record "$expectedPath" `
            --existing-record "$existingArg" `
            --epoch-commit "$epochCommit" `
            --epoch-hash "$epochHash" `
            --dispatch-sha "$dispatchSha" `
            --checked-out-sha "$checkedOutSha" `
            --out $handoffPath
          if ($LASTEXITCODE -ne 0) { Write-Error "TRUST_EPOCH_FINALIZATION_TERMINAL: the finalization did not reach a success state"; exit 1 }
          $decision = Get-Content "$handoffDir/epoch-pr-decision.json" -Raw | ConvertFrom-Json
          "FINALIZATION_RESULT=$($decision.state)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "FINALIZATION_RESULT=$($decision.state) PR_HANDOFF_REQUIRED=$($decision.pr_required)"

      # The evidence. Two narrow generated files: the proposal Stage A measured, and the handoff the App consumes.
      # NOT a corpus root, and never a credential.
      - name: Record the finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-epoch-finalization-${{ github.run_id }}
          path: |
            artifacts/platform-foundation/trust/trust-migration-proposal.json
            artifacts/platform-foundation/trust/epoch-pr-handoff.json
            artifacts/platform-foundation/trust/epoch-pr-decision.json
          if-no-files-found: warn